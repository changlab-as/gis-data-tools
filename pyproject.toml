[project]
name = "gis-data-tools"
version = "0.1.0"
description = "Tools to work with GIS data, e.g. GPX files from GPS machine, user-generated KML"
package-mode = false
authors = [
    {name = "Your Name",email = "you@example.com"}
]
license = "MIT"
readme = "README.md"
requires-python = "3.11.13"
dependencies = [
    "gpxpy (==1.6.2)",
    "simplekml (==1.3.6)"
]
packages = [{include = "gis_data_tools", from = "src"}]

[dependency-groups]
dev = [
    "black (==26.3.1)",
    "flake8 (==7.3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 75
